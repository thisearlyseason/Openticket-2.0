<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^6.28.0",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
      }
    }
    </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OpenTicket - Community Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            background: 'var(--color-background)',
            surface: 'var(--color-surface)',
            primary: 'var(--color-primary)',
            'primary-fg': 'var(--color-primary-fg)',
            secondary: 'var(--color-secondary)',
            'secondary-fg': 'var(--color-secondary-fg)',
            accent: 'var(--color-accent)',
            'neon-green': '#00ff9d',
          },
          animation: {
            'blob': "blob 10s infinite",
            'float': "float 6s ease-in-out infinite",
            'pulse-slow': "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
          },
          keyframes: {
            blob: {
              "0%": { transform: "translate(0px, 0px) scale(1)" },
              "33%": { transform: "translate(30px, -50px) scale(1.2)" },
              "66%": { transform: "translate(-20px, 20px) scale(0.8)" },
              "100%": { transform: "translate(0px, 0px) scale(1)" },
            },
            float: {
              "0%, 100%": { transform: "translateY(0)" },
              "50%": { transform: "translateY(-10px)" },
            }
          },
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --color-background: #ffffff;
      --color-surface: #f4f4f5;
      --color-primary: #0f172a;
      --color-primary-fg: #ffffff;
      /* Slate 900 - Dark & Readable */
      --color-secondary: #E0FF20;
      /* High-contrast Neon Yellow */
      --color-secondary-fg: #000000;
      /* Black text on Neon */
      --color-accent: #059669;
      /* Emerald 600 */
    }

    .dark {
      --color-background: #000000;
      /* Pure Black to match Landing */
      --color-surface: #121212;
      /* Very Dark Grey */
      --color-primary: #ec4899;
      /* Neon Pink */
      --color-primary-fg: #000000;
      /* Black text on Pink */
      --color-secondary: #E0FF20;
      /* Neon Yellow */
      --color-secondary-fg: #000000;
      /* Black text on Neon Yellow */
      --color-accent: #00ff9d;
      /* Neon Green */
    }

    .glass {
      background-color: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .dark .glass {
      background-color: rgba(0, 0, 0, 0.7);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Rich Text Rendering */
    .rich-text-content h2,
    .rich-text-editor h2 {
      font-size: 1.875rem;
      font-weight: 800;
      margin-top: 2rem;
      margin-bottom: 1rem;
      line-height: 1.2;
      color: #0f172a;
      letter-spacing: -0.025em;
    }

    .dark .rich-text-content h2,
    .dark .rich-text-editor h2 {
      color: #f8fafc;
    }

    .rich-text-content h3,
    .rich-text-editor h3 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      line-height: 1.3;
      color: #0f172a;
    }

    .dark .rich-text-content h3,
    .dark .rich-text-editor h3 {
      color: #f8fafc;
    }

    .rich-text-content ul,
    .rich-text-editor ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .rich-text-content ol,
    .rich-text-editor ol {
      list-style-type: decimal;
      padding-left: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .rich-text-content li,
    .rich-text-editor li {
      margin-bottom: 0.5rem;
    }

    .rich-text-content strong,
    .rich-text-editor strong {
      font-weight: 800;
      color: #000000;
    }

    .dark .rich-text-content strong,
    .dark .rich-text-editor strong {
      color: #ffffff;
    }

    .rich-text-content blockquote,
    .rich-text-editor blockquote {
      border-left: 4px solid var(--color-primary);
      padding-left: 1.25rem;
      margin-left: 0;
      font-style: italic;
      color: #475569;
      margin-bottom: 1.5rem;
      font-size: 1.125rem;
    }

    .dark .rich-text-content blockquote,
    .dark .rich-text-editor blockquote {
      color: #94a3b8;
    }

    .rich-text-content p,
    .rich-text-editor p {
      margin-bottom: 1rem;
      line-height: 1.75;
    }

    .rich-text-content img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      margin: 1rem 0;
    }

    /* Fix for date picker icon color in dark mode */
    .dark input[type="date"]::-webkit-calendar-picker-indicator,
    .dark input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: 0.6;
    }

    /* Custom Date Picker Input - Full Click Area */
    .custom-picker-input::-webkit-calendar-picker-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* Neon Green for Dashboard inputs (#84cc16) - High Specificity */
    html.dark .neon-picker-indicator::-webkit-calendar-picker-indicator,
    .neon-picker-indicator::-webkit-calendar-picker-indicator {
      filter: invert(72%) sepia(85%) saturate(366%) hue-rotate(33deg) brightness(94%) contrast(92%);
      cursor: pointer;
      opacity: 1 !important;
    }

    html {
      color-scheme: light;
    }

    html.dark {
      color-scheme: dark;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .custom-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
